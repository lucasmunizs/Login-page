<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/Style.css">
    <link rel="icon" href="./assets/favicon.ico">
    <title>Login</title>
</head>
<body>
    <form method="post">
    <section class="container">
        <div class="container_box">
            <img src="./assets/perfil.png" class="container_box_avatar" alt="Avatar Image">
            <h2  class="container_box_titulo">Login</h2>
                <div class="container_inputBox">
                    <p>Usuário</p>
                    <input type="text" name="username" required>
                    <i></i>
                </div>
                <div class="container_inputBox">
                    <p>Senha</p>
                    <input type="password" name="password" required>
                    <i></i>
                </div>
                <div class="container_box_checkbox">
                    <input type="checkbox" id="lembrar" name="lembrar" value="lembrar">
                    <label for="lembrar" class="container_box_checkbox_label">Lembrar senha</label>
                </div>
                <button type="submit" class="container_box_botao">Acessar</button>
            </form>
        </div>
    </section>
    
</body>
</html>
